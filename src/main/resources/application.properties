spring.application.name=farmconnect
server.port=8081

# ── Database ──────────────────────────────────────────────────────────────────
# Use environment variables in production:
#   export DB_URL=jdbc:mysql://host:3306/farmconnect
#   export DB_USERNAME=myuser
#   export DB_PASSWORD=mypassword
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/farmconnect}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root@123}

# ── JPA ───────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ── JWT ───────────────────────────────────────────────────────────────────────
# Override with a strong secret in production:
#   export JWT_SECRET=<64+ char random string>
#   export JWT_EXPIRATION=86400000
jwt.secret=${JWT_SECRET:yourSuperSecretKeyWhichShouldBeAtLeast32CharactersLong12345}
jwt.expiration=${JWT_EXPIRATION:86400000}