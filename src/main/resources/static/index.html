<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>FarmConnect — Fresh from the farm, straight to you</title>
    <meta name="description" content="FarmConnect links farmers directly with buyers. No middlemen, fair prices, fresh produce.">
    <meta name="theme-color" content="#2e7d4f">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/app.css">
    <script>
        // Apply saved theme before first paint to avoid a flash
        try {
            const t = localStorage.getItem('fc.theme');
            if (t) document.documentElement.dataset.theme = t;
        } catch (e) {}
    </script>
</head>
<body>
    <a class="skip-link" href="#view">Skip to content</a>

    <header class="site-header" id="site-header">
        <div class="container header-inner">
            <a href="#/" class="brand" aria-label="FarmConnect home">
                <span class="brand-mark" aria-hidden="true">🌾</span>
                <span class="brand-name">Farm<span>Connect</span></span>
            </a>

            <nav class="main-nav" id="main-nav" aria-label="Main"></nav>

            <div class="header-actions">
                <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle dark mode">
                    <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                    <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
                </button>
                <div class="header-auth" id="header-auth"></div>
                <button class="icon-btn menu-btn" id="menu-btn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-drawer">
                    <span></span><span></span><span></span>
                </button>
            </div>
        </div>
    </header>

    <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
    <aside class="mobile-drawer" id="mobile-drawer" aria-label="Menu" aria-hidden="true"></aside>

    <main id="view" class="view" tabindex="-1"></main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <div class="footer-brand">
                <a href="#/" class="brand"><span class="brand-mark" aria-hidden="true">🌾</span><span class="brand-name">Farm<span>Connect</span></span></a>
                <p>Connecting the people who grow our food with the people who eat it. No middlemen.</p>
            </div>
            <div class="footer-links">
                <div>
                    <h4>Marketplace</h4>
                    <a href="#/market">Browse produce</a>
                    <a href="#/register?role=FARMER">Sell your harvest</a>
                </div>
                <div id="footer-account">
                    <h4>Account</h4>
                    <a href="#/login">Log in</a>
                    <a href="#/register">Create account</a>
                </div>
            </div>
        </div>
        <div class="container footer-bottom">© <span id="year"></span> FarmConnect. Grown with care in India.</div>
    </footer>

    <div class="toast-stack" id="toast-stack" aria-live="polite" aria-atomic="false"></div>
    <div id="modal-root"></div>

    <script type="module" src="/assets/js/app.js"></script>
</body>
</html>
